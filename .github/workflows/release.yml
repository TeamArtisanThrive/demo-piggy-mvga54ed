name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir out
          cp src.txt out/build.txt
          echo "built-from: $(git rev-parse HEAD)" >> out/build.txt
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" || true
          gh release upload "${GITHUB_REF_NAME}" out/build.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}
